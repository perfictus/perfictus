<section class="pf-section">
    <div class="pf-blob pf-blob--green" style="top: 10%; left: -300px;"></div>
    <div class="container">
        <div class="row g-4">
            <div class="col-md-6" data-aos="fade-up">
                <div class="pf-card pf-contact-card" pfSpotlight>
                    <span class="pf-icon"><i class="fa-solid fa-envelope"></i></span>
                    <h3>Email Address</h3>
                    <a class="pf-contact-line" [href]="'mailto:' + contact.email">{{ contact.email }}</a>
                </div>
            </div>
            <div class="col-md-6" data-aos="fade-up" data-aos-delay="120">
                <div class="pf-card pf-contact-card" pfSpotlight>
                    <span class="pf-icon"><i class="fa-solid fa-phone-volume"></i></span>
                    <h3>Phone Number</h3>
                    @for (group of contact.phones; track group.country) {
                    <div class="pf-contact-line pf-phone-group">
                        <img [src]="group.flag" [alt]="group.country" class="pf-flag">
                        <span class="pf-phone-nums">
                            @for (phone of group.numbers; track phone.href) {
                            <a [href]="phone.href">{{ phone.label }}</a>
                            }
                        </span>
                    </div>
                    }
                </div>
            </div>
        </div>

        <div class="row g-4 mt-1">
            <div class="col-md-6" data-aos="fade-up">
                <a class="pf-card pf-contact-card d-block" [href]="contact.whatsapp" target="_blank" rel="noopener" pfSpotlight>
                    <span class="pf-icon"><i class="fab fa-whatsapp"></i></span>
                    <h3>WhatsApp</h3>
                    <span class="pf-contact-line">Chat with us <i class="fa-solid fa-arrow-right"></i></span>
                </a>
            </div>
            <div class="col-md-6" data-aos="fade-up" data-aos-delay="120">
                <div class="pf-card pf-contact-card" pfSpotlight>
                    <span class="pf-icon"><i class="fa-solid fa-share-nodes"></i></span>
                    <h3>Follow Us</h3>
                    <div class="pf-socials mt-3">
                        @for (social of contact.socials; track social.href) {
                        <a [href]="social.href" target="_blank" rel="noopener" [attr.aria-label]="social.name"><i [class]="social.icon"></i></a>
                        }
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
