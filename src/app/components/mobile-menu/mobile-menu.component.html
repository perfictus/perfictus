<div class="pf-mmenu" [class.is-open]="isMenuOpen" [class.is-instant]="instant" [attr.aria-hidden]="!isMenuOpen">
    <ul>
        @for (item of links; track item.link) {
        <li>
            <a class="pf-mmenu-link" [routerLink]="item.link" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: item.link === '/' }" (click)="navigate()">
                {{ item.title }} <i class="fa-solid fa-arrow-right"></i>
            </a>
        </li>
        }
    </ul>

    <div>
        <div class="pf-mmenu-contact">
            @for (group of contact.phones; track group.country) {
            <div class="pf-phone-group">
                <img [src]="group.flag" [alt]="group.country" class="pf-flag">
                <span class="pf-phone-nums">
                    @for (phone of group.numbers; track phone.href) {
                    <a [href]="phone.href">{{ phone.label }}</a>
                    }
                </span>
            </div>
            }
            <a [href]="'mailto:' + contact.email"><i class="fa-solid fa-envelope"></i> {{ contact.email }}</a>
        </div>
        <div class="pf-socials mt-4">
            @for (social of contact.socials; track social.href) {
            <a [href]="social.href" target="_blank" rel="noopener" [attr.aria-label]="social.name"><i [class]="social.icon"></i></a>
            }
        </div>
    </div>
</div>
