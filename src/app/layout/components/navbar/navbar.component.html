<header class="pf-header" [class.is-scrolled]="isSticky || isMenuOpen">
    <div class="container">
        <a routerLink="/home" class="pf-logo" (click)="scrollTop(); closeMenu()">
            <img src="assets/img/logo/perfictus-white.png" alt="Perfictus">
        </a>

        <ul class="pf-nav">
            @for (item of links; track item.link) {
            <li><a [routerLink]="item.link" routerLinkActive="is-active">{{ item.title }}</a></li>
            }
        </ul>

        <a routerLink="/contact" class="pf-btn pf-btn--sm pf-header-cta">
            Contact Us <i class="fa-solid fa-arrow-right"></i>
        </a>

        <a routerLink="/contact" routerLinkActive="is-active" class="pf-contact-icon" aria-label="Contact us"
            (click)="closeMenu(false)">
            <i class="fa-solid fa-phone"></i>
        </a>

        <button type="button" class="pf-burger" [class.is-open]="isMenuOpen" (click)="toggleMenu()"
            [attr.aria-expanded]="isMenuOpen" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
    </div>
</header>

<app-mobile-menu [isMenuOpen]="isMenuOpen" (closeMenuEvent)="closeMenu()" />
